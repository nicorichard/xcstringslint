on:
  release:
    types: [published]
name: Build and upload xcstringslint release binary
jobs:
  build-macos:
    name: Build macOS Executable
    runs-on: macos-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Build macOS binary
        id: build
        run: |
          swift build -c release --arch x86_64 --arch arm64
          mkdir -p builds
          mv $(swift build -c release --arch x86_64 --arch arm64 --show-bin-path) builds/xcstringslint
          echo "path=builds/xcstringslint" >> "$GITHUB_OUTPUT"

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.path }}